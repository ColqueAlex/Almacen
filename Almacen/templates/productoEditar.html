{% extends 'plantillas.html' %}

{% block content %}

    <h2 class="text-center my-4">Editar Producto</h2>

    <form action="{% url 'editar' %}" class="w-50 shadow mx-auto p-4 m-3 rounded bg-white" method="post">
        {% csrf_token %}

        <input type="hidden" name="id" value="{{ producto.id }}">

        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre:</label>
            <input type="text" name="nombre" class="form-control" required value="{{ producto.nombre }}">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Categoría:</label>
            <input type="text" name="categoria" class="form-control" required value="{{ producto.categoria }}" pattern="^(?!.*\d)[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$" title="La categoría no puede contener números.">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Marca:</label>
            <input type="text" name="marca" class="form-control" value="{% if producto.marca %}{{ producto.marca }}{% else %}Sin marca{% endif %}">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Precio de Venta ($):</label>
            <input type="number" name="precio" min="0.01" step="0.01" class="form-control" required value="{{ producto.precio }}">
        </div>

        <!-- NUEVO: Selector de Proveedores para Edición -->
        <div class="mb-3">
            <label for="proveedores" class="form-label fw-semibold">Proveedores Habituales:</label>
            <select name="proveedores" id="proveedores" class="form-select" multiple size="4">
                {% for prov in proveedores %}
                    <option value="{{ prov.id }}" {% if prov in producto.proveedores.all %}selected{% endif %}>
                        {{ prov.nombre }}
                    </option>
                {% endfor %}
            </select>
            <div class="form-text text-muted small">
                <i class="fa-solid fa-circle-info me-1"></i>Mantené apretada la tecla <strong>Ctrl</strong> para seleccionar más de uno.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Estado:</label>
            <select name="estado" class="form-select" required>
                <option value="activo" {% if producto.estado == 'activo' %}selected{% endif %}>Activo</option>
                <option value="inactivo" {% if producto.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
            </select>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <a href="{% url 'consultar' %}" class="btn btn-secondary">Cancelar</a>
            <input type="submit" value="Actualizar Producto" class="btn btn-primary">
        </div>
    </form>

{% endblock %}
