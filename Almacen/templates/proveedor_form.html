{% extends 'plantillas.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">{% if es_edicion %}Editar Proveedor{% else %}Nuevo Proveedor{% endif %}</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre:</label>
                            <input type="text" name="nombre" value="{{ proveedor.nombre }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Número de Teléfono:</label>
                            <input type="text" name="telefono" value="{{ proveedor.numero_telefono }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo de Productos / Rubro:</label>
                            <input type="text" name="tipo_productos" value="{{ proveedor.tipo_productos }}" class="form-control" placeholder="Ej: Lácteos, Bebidas, Golosinas" required>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listar_proveedores' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
