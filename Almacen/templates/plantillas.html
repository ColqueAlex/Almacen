{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElRefugio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand py-0" href="#">
                <img src="{% static 'img/logo.png' %}" alt="Logo El Refugio" height="50" class="d-inline-block align-text-top rounded">
            </a>
            
            {% if user.is_authenticated %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto ms-3">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold fs-5" href="{% url 'consultar' %}">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold fs-5" href="#">Proveedores</a>
                        </li>
                        {% if user.is_superuser or user.is_admin %}
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold fs-5" href="{% url 'listar_usuarios' %}">Usuarios</a>
                        </li>
                        {% endif %}
                    </ul>

                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item me-2">
                            <span class="nav-link text-white fw-semibold">
                                <i class="fa-solid fa-user me-1"></i> Hola, {{ user.username }}
                            </span>
                        </li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light text-danger bg-white btn-sm fw-bold px-3">
                                    <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="py-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
